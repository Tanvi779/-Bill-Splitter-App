<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Splitter</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="file.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense Splitter</h1>
      <p class="subtitle">Easily split bills between friends</p>
    </header>

    <section class="card">
      <form id="split-form">
        <fieldset>
          <legend>Bill Details</legend>

          <div class="form-group">
            <label for="totalAmount">Total Amount ($)</label>
            <input type="number" id="totalAmount" placeholder="Enter total bill" min="0" step="0.01" required />
          </div>

          <div class="form-group">
            <label for="peopleCount">Number of People</label>
            <input type="number" id="peopleCount" placeholder="Enter people count" min="1" required />
          </div>

          <div class="form-group">
            <label for="tipPercent">Tip (%)</label>  
            <input type="number" id="tipPercent" placeholder="Optional" min="0" step="0.01" />
          </div>

        </fieldset>
        <div class="button-group">
          <button type="submit" aria-label="calculate and split the expense">Split Expense</button>
          <button type="reset" aria-label="clear all inputs">Clear</button>
        </div>
      </form>
    </section>

    <section class="result card" id="result" aria-live="polite">
      <h2>Result:</h2>
      <p id="split-amount"></p>
    </section>
  </div>
</body>
</html>
